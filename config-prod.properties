# =============================================
# Production datasource config - Neon.tech
# This file is placed at /app/config/application.properties in Docker
# and has HIGHER priority than the bundled application.properties
# =============================================
quarkus.datasource.jdbc.url=jdbc:postgresql://ep-divine-pond-aqlm32g9.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require
quarkus.datasource.username=neondb_owner
quarkus.datasource.password=npg_w18WZmycVdhU

# Disable DevServices (prevents Quarkus from trying to create local PostgreSQL)
quarkus.datasource.devservices.enabled=false

# Increase connection pool timeouts for Neon (SSL handshake can be slow)
quarkus.datasource.jdbc.acquisition-timeout=30
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=5

# Redis (disable if not available in production)
quarkus.redis.hosts=redis://localhost:6379
