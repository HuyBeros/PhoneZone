# Tests use a separate disposable database, never the development database.
quarkus.datasource.jdbc.url=${TEST_DB_JDBC_URL:jdbc:postgresql://localhost:5432/phonezone_test}
quarkus.datasource.username=${TEST_DB_USERNAME:postgres}
quarkus.datasource.password=${TEST_DB_PASSWORD:123456}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.quinoa=false
phonezone.catalog-cache.enabled=false
quarkus.redis.hosts=${TEST_REDIS_URL:redis://localhost:6380}
quarkus.http.test-port=8081
mp.jwt.verify.publickey.location=classpath:testPublicKey.pem
smallrye.jwt.sign.key.location=classpath:testPrivateKey.pem
