## =============================================
## Quinoa (Frontend Integration)
## =============================================
quarkus.quinoa.package-manager-install.node-version=22.22.0
quarkus.quinoa.package-manager-install=true
%prod.quarkus.quinoa.package-manager-install.install-dir=.quinoa/production
## SPA routing: chuyển tất cả request không phải /api về index.html
quarkus.quinoa.enable-spa-routing=true
## Không forward các request /api sang Vite dev server
quarkus.quinoa.ignored-path-prefixes=/api

## =============================================
## DataSource - PostgreSQL
## =============================================
quarkus.datasource.db-kind=postgresql

## Global datasource - dùng biến môi trường, fallback về local
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:123456}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/phonezone_db}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.jdbc.min-size=0
%prod.quarkus.datasource.jdbc.max-size=5
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.port=${PORT:8080}

## Dev: tắt devservices (dùng PostgreSQL thật)
%dev.quarkus.datasource.devservices.enabled=false

## =============================================
## Redis public catalog cache
## =============================================
## Redis is optional; public catalog reads fall back to PostgreSQL on connection failure.
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
quarkus.redis.devservices.enabled=false
quarkus.redis.timeout=300ms
quarkus.redis.tcp.connection-timeout=300ms
phonezone.catalog-cache.enabled=${CATALOG_CACHE_ENABLED:true}
%prod.phonezone.catalog-cache.enabled=${CATALOG_CACHE_ENABLED:false}
phonezone.catalog-cache.namespace=${CATALOG_CACHE_NAMESPACE:phonezone:catalog:v1}
phonezone.catalog-cache.ttl=${CATALOG_CACHE_TTL:60s}
phonezone.catalog-cache.retry-delay=5s

## =============================================
## Hibernate ORM
## =============================================
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true

## Dev: auto-create/update schema
%dev.quarkus.hibernate-orm.database.generation=update

## PROD: không tự động thay đổi schema
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file

## =============================================
## Flyway
## =============================================
quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.clean-disabled=true

## Demo users are local only. Production admin creation is explicit and one-time.
phonezone.demo-users.enabled=false
%dev.phonezone.demo-users.enabled=true
phonezone.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
phonezone.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
phonezone.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@example.invalid}
phonezone.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

## =============================================
## JWT
## =============================================
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:.local/keys/publicKey.pem}
mp.jwt.verify.issuer=phonezone-issuer
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:.local/keys/privateKey.pem}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

## =============================================
## CORS
## =============================================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:https://phonezone-app.onrender.com}
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, origin
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS

## =============================================
## Dev overrides
## =============================================
%dev.quarkus.log.level=INFO
%dev.quarkus.http.access-log.enabled=true

## =============================================
## VNPay
## =============================================
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.secretKey=${VNPAY_SECRET_KEY:}
vnpay.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
