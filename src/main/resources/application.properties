## =============================================
## Quinoa (Frontend Integration)
## =============================================
quarkus.quinoa.package-manager-install.node-version=20.10.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.ui-root-path=quinoa

## =============================================
## DataSource - PostgreSQL
## =============================================
quarkus.datasource.db-kind=postgresql

## Dev datasource (local Docker)
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=123456
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/phonezone_db

## Production datasource - read from Render environment variables
## Set these on Render: DB_URL, DB_USERNAME, DB_PASSWORD
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.jdbc.acquisition-timeout=30
%prod.quarkus.datasource.jdbc.min-size=1
%prod.quarkus.datasource.jdbc.max-size=5

## =============================================
## Hibernate ORM
## =============================================
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true

## QUAN TRỌNG: Tắt DDL auto-generation trong production
## Lý do: Hibernate tạo JTA isolated connection riêng để check schema,
## connection này dùng credentials mặc định "postgres" thay vì credentials thật
## => Tạo bảng thủ công trên Neon SQL Editor (xem hướng dẫn bên dưới)
%prod.quarkus.hibernate-orm.database.generation=none

## =============================================
## Flyway
## =============================================
quarkus.flyway.migrate-at-start=false

## =============================================
## Redis
## =============================================
%dev.quarkus.redis.hosts=redis://localhost:6379
%prod.quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

## =============================================
## JWT
## =============================================
mp.jwt.verify.publickey.location=classpath:publicKey.pem
mp.jwt.verify.issuer=phonezone-issuer
smallrye.jwt.sign.key.location=classpath:privateKey.pem

## =============================================
## CORS
## =============================================
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, origin
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS

## =============================================
## Dev overrides
## =============================================
%dev.quarkus.log.level=INFO

